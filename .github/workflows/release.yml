name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: Standalone Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: pyinstaller packaging/segsynth.spec --noconfirm
      - name: Smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist\SegSynth\SegSynth.exe -PassThru
          Start-Sleep 8
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          Stop-Process $p -Force -ErrorAction SilentlyContinue
      - name: Zip
        shell: pwsh
        run: |
          $v = python -c "import segsynth; print(segsynth.__version__)"
          Compress-Archive -Path dist\SegSynth -DestinationPath "SegSynth-$v-windows-standalone.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-standalone
          path: SegSynth-*-windows-standalone.zip

  offline-bundles:
    name: Offline wheel bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install wheel setuptools
      - run: python packaging/build_offline_bundle.py --platform win_amd64
      - run: python packaging/build_offline_bundle.py --platform linux_x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: offline-bundles
          path: release/*.zip

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-exe, offline-bundles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          generate_release_notes: true
